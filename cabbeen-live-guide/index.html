<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111111"><meta name="description" content="卡宾主播男装讲货知识库：风格、版型、面料、工艺、深度话术与镜头证明。"><meta name="robots" content="noindex,nofollow,noarchive"><link rel="manifest" href="./manifest.webmanifest"><title>卡宾主播讲货助手</title><style>*{box-sizing:border-box}body{margin:0;background:#111;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px}.box{width:min(420px,100%);text-align:center}.logo{width:54px;height:54px;border-radius:16px;background:#f2eee7;color:#111;display:grid;place-items:center;margin:0 auto 18px;font-weight:800}.box h1{font-size:24px;margin:0 0 8px}.box p{font-size:13px;color:#aaa;margin:0 0 20px}.bar{height:4px;background:#333;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;width:5%;background:#a8733f;border-radius:99px;transition:.2s}.status{font-size:12px;color:#888;margin-top:12px}.err{display:none;margin-top:18px;padding:14px;border:1px solid #553b2d;background:#211711;border-radius:12px;color:#e7c8ad;text-align:left;font-size:12px;line-height:1.7}</style></head><body><div class="wrap"><div class="box"><div class="logo">C</div><h1>卡宾主播讲货助手</h1><p>正在载入知识库，请稍候</p><div class="bar"><i id="bar"></i></div><div id="status" class="status">准备内容…</div><div id="err" class="err"></div></div></div><script>const P=['p01','p02','p03','p04','p05','p06','p07','p08','p09','p10','p11','p12','p13','p14a','p14b','p15a','p15b','p16a','p16b','p17'].map(x=>`./data/${x}.txt?v=20260813`),bar=document.getElementById('bar'),status=document.getElementById('status'),err=document.getElementById('err');(async()=>{try{if(!('DecompressionStream'in window))throw new Error('当前浏览器版本过旧，请使用最新版微信或系统浏览器打开。');let a=[];for(let i=0;i<P.length;i++){status.textContent=`载入知识库 ${i+1}/${P.length}`;let r=await fetch(P[i],{cache:'no-store'});if(!r.ok)throw new Error(`内容加载失败 ${i+1}/${P.length}（${r.status}）`);a.push((await r.text()).trim());bar.style.width=`${5+(i+1)*4.5}%`}status.textContent='正在打开知识库…';let s=a.join('').replace(/\s/g,''),b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);let st=new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip')),html=await new Response(st).text();bar.style.width='100%';document.open();document.write(html);document.close()}catch(e){status.textContent='加载失败';err.style.display='block';err.textContent=e.message+'\n\n请刷新页面重试；若仍失败，请把本页截图发给运营。'}})();</script></body></html>
