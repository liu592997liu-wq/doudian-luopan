<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111111"><meta name="description" content="卡宾主播男装讲货知识库：风格、版型、面料、工艺、深度话术与镜头证明。"><meta name="robots" content="noindex,nofollow,noarchive"><link rel="manifest" href="./manifest.webmanifest"><title>卡宾主播讲货助手</title><style>*{box-sizing:border-box}body{margin:0;background:#111;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px}.box{width:min(420px,100%);text-align:center}.logo{width:54px;height:54px;border-radius:16px;background:#f2eee7;color:#111;display:grid;place-items:center;margin:0 auto 18px;font-weight:800}.box h1{font-size:24px;margin:0 0 8px}.box p{font-size:13px;color:#aaa;margin:0 0 20px}.bar{height:4px;background:#333;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;width:8%;background:#a8733f;border-radius:99px;transition:.25s}.status{font-size:12px;color:#888;margin-top:12px}.err{display:none;margin-top:18px;padding:14px;border:1px solid #553b2d;background:#211711;border-radius:12px;color:#e7c8ad;text-align:left;font-size:12px;line-height:1.7}</style></head><body><div class="wrap"><div class="box"><div class="logo">C</div><h1>卡宾主播讲货助手</h1><p>正在载入知识库，请稍候</p><div class="bar"><i id="bar"></i></div><div id="status" class="status">准备内容…</div><div id="err" class="err"></div></div></div><script>const PARTS=Array.from({length:10},(_,i)=>`./data-v2/c${String(i).padStart(2,'0')}.txt`);const bar=document.getElementById('bar'),status=document.getElementById('status'),err=document.getElementById('err');async function boot(){try{if(!('DecompressionStream'in window))throw new Error('当前浏览器版本过旧，不支持知识库解压。请使用最新版微信或系统浏览器打开。');let arr=[];for(let i=0;i<PARTS.length;i++){status.textContent=`载入知识库 ${i+1}/${PARTS.length}`;let r=await fetch(PARTS[i],{cache:'no-store'});if(!r.ok)throw new Error(`内容分片 ${i+1} 加载失败 (${r.status})`);arr.push((await r.text()).trim());bar.style.width=`${8+(i+1)*7}%`}status.textContent='正在打开知识库…';let b64=arr.join('').replace(/\s/g,''),bin=atob(b64),u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);let stream=new Blob([u8]).stream().pipeThrough(new DecompressionStream('gzip'));let html=await new Response(stream).text();bar.style.width='100%';document.open();document.write(html);document.close()}catch(e){status.textContent='加载失败';err.style.display='block';err.textContent=e.message+'\n\n请刷新页面重试；若仍失败，请把本页截图发给运营。'}}boot();</script></body></html>
